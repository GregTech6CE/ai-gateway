name: gt6ce control

# A（issue 仓库）的 .github/workflows/ai-analysis.yml 模板。
# 与 issue 仓库中的实际文件保持同步。
# A 只负责：installation check、占位评论、dispatch。最终写入由 B 侧独立的 finalize job 完成；
# A 不轮询、不下载 artifact、不渲染。
#
# 这里的 control CLI 来自现场克隆的 ai-gateway，因此需要在 A 内构建一次
# `apps/ci/dist`。构建只跑 pnpm 安装与 tsdown，不接触任何模型 key。

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue:
        description: issue 编号
        required: true
        type: string
      dry_run:
        description: 为 true 时只跑 gate/analysis、不发评论
        required: false
        default: "false"
        type: string

permissions:
  contents: read

concurrency:
  group: gt6ce-trigger-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false

jobs:
  gate:
    if: |
      (vars.BOT_ENABLED != 'false') &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'issues' && github.event.issue.user.type != 'Bot') ||
       (github.event_name == 'issue_comment' &&
        github.event.comment.user.type != 'Bot' &&
        contains(github.event.comment.body, vars.GT6CE_BOT_MENTION || '@gt6ce-bot') &&
        (github.event.comment.author_association == 'OWNER' ||
         github.event.comment.author_association == 'MEMBER' ||
         github.event.comment.author_association == 'COLLABORATOR')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Clone execution repo
        run: |
          set -euo pipefail
          git init -q .bot
          git -C .bot remote add origin https://github.com/GregTech6CE/ai-gateway.git
          git -C .bot fetch -q --depth 1 origin master
          git -C .bot checkout -q FETCH_HEAD

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build control CLI
        working-directory: .bot
        run: |
          set -euo pipefail
          node common/scripts/install-run-rush.js install
          node common/scripts/install-run-rush.js build --to @gt6ce/ci

      - name: App token (issues:write on this repository)
        id: app_rw
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GT6CE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GT6CE_APP_PRIVATE_KEY }}
          permission-issues: write

      - name: App token (actions:write on ai-gateway)
        id: app_dispatch
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.GT6CE_APP_CLIENT_ID }}
          private-key: ${{ secrets.GT6CE_APP_PRIVATE_KEY }}
          owner: GregTech6CE
          repositories: ai-gateway
          permission-actions: write

      - name: Start control
        id: start
        env:
          CI_ROOT: .bot
          REPO: ${{ github.repository }}
          ISSUE: ${{ github.event.issue.number || inputs.issue }}
          EVENT: ${{ github.event_name == 'workflow_dispatch' && 'issues' || github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id || '' }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
          REQUEST_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          BOT_NAME: ${{ vars.GT6CE_BOT_NAME || 'gt6ce-bot' }}
          B_REPO: GregTech6CE/ai-gateway
          GH_RW_TOKEN: ${{ steps.app_rw.outputs.token }}
          B_PAT: ${{ steps.app_dispatch.outputs.token }}
        run: node .bot/apps/ci/dist/jobs/control.js start
