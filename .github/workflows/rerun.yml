name: rerun

# 仅管理员可触发；跳过 L0/L1，接受自由 prompt。
# 只有仓库管理员能触发这个 workflow。

on:
  workflow_dispatch:
    inputs:
      repo:
        required: true
        type: string
      issue:
        required: true
        type: string
      prompt:
        description: 可选自由 prompt；留空则使用 prompts/analyze.md
        required: false
        type: string
      ref:
        description: 代码 ref（tag/branch），默认 master
        required: false
        default: master
        type: string

permissions:
  contents: read
  actions: write

jobs:
  rerun:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: llm
    steps:
      - uses: actions/checkout@v4
      - name: Parse target repo
        id: target
        env:
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          owner="${TARGET_REPO%%/*}"
          name="${TARGET_REPO#*/}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: App token (read, step scoped)
        id: app_ro
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          client-id: ${{ vars.LILY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LILY_APP_PRIVATE_KEY }}
          permission-issues: read
          permission-contents: read
      - name: Snapshot
        id: snap
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          GH_RO_TOKEN: ${{ steps.app_ro.outputs.token }}
          SELF_TOKEN: ${{ github.token }}
          B_REPO: ${{ github.repository }}
        run: |
          mkdir -p inputs
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, "scripts")
          import common as c
          import model_pool
          repo, issue = os.environ["REPO"], os.environ["ISSUE"]
          token = os.environ["GH_RO_TOKEN"]
          repo_cfg = c.load_repo(repo)
          if not repo_cfg.get("enabled"):
              raise SystemExit(f"repo disabled: {repo}")
          cache_prefix = "gt6-mirror-" + repo_cfg["code_repo"].lower().replace("/", "-")
          data = c.request("GET", f"/repos/{repo}/issues/{issue}", token)
          comments = c.paginate(f"/repos/{repo}/issues/{issue}/comments", token, 5)
          snap = {"repo": repo, "issue": {"number": data["number"], "title": data.get("title", ""), "body": data.get("body", "")},
                  "comments": [{"id": x["id"], "author": x["user"]["login"], "body": x.get("body", "")} for x in comments],
                  "attachments": c.attachments((data.get("body") or "") + "\n" + "\n".join(x.get("body") or "" for x in comments))}
          canonical = json.dumps(snap, ensure_ascii=False, sort_keys=True)
          snap["sha256"] = c.sha256_text(canonical)
          c.dump_json("inputs/snapshot.json", snap)
          pool = model_pool.load_pool(repo_cfg.get("model_pool", "shared"))
          health = model_pool.read_health(os.environ.get("SELF_TOKEN", ""), os.environ.get("B_REPO", ""))
          c.dump_json("inputs/model.json", {"pool": repo_cfg.get("model_pool", "shared"), "analysis_entries": model_pool.candidates(pool, "analysis", health)})
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as fh:
              fh.write(f"sha={snap['sha256']}\n")
              fh.write(f"title={snap['issue']['title']}\n")
              fh.write(f"code_repo={repo_cfg['code_repo']}\n")
              fh.write(f"cache_prefix={cache_prefix}\n")
          PY
      - name: Install Codex CLI (pin before production)
        run: npm install -g @openai/codex@0.166.0
      - name: Restore GT6 mirror
        uses: actions/cache/restore@v4
        with:
          path: .cache/gt6.git
          key: ${{ steps.snap.outputs.cache_prefix }}-${{ github.run_id }}
          restore-keys: ${{ steps.snap.outputs.cache_prefix }}-
      - name: Sync mirror and create worktrees
        env:
          CODE_REPO: ${{ steps.snap.outputs.code_repo }}
          CODE_REFS: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          if [ -d .cache/gt6.git ]; then
            git -C .cache/gt6.git remote set-url origin "https://github.com/$CODE_REPO.git"
            git -C .cache/gt6.git fetch --prune --tags
            rm -rf .cache/gt6.git/code
            git -C .cache/gt6.git worktree prune
          else
            git clone --mirror "https://github.com/$CODE_REPO.git" .cache/gt6.git
          fi
          worktree_root="$PWD/code"
          mkdir -p "$worktree_root"
          primary=""
          for ref in $CODE_REFS; do
            slug=$(printf '%s' "$ref" | tr '/ ' '__')
            git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" "$ref" || \
              git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" master
            if [ -z "$primary" ]; then primary="$slug"; fi
          done
          ln -sfn "$primary" code/current
      - name: Save GT6 mirror
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/gt6.git
          key: ${{ steps.snap.outputs.cache_prefix }}-${{ github.run_id }}
      - name: Prefetch attachments
        run: python scripts/prefetch.py
      - name: Run Codex
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          GH_RO_TOKEN: ${{ steps.app_ro.outputs.token }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          MODEL_KEY_MISTRAL: ${{ secrets.MODEL_KEY_MISTRAL }}
          RERUN_PROMPT: ${{ inputs.prompt }}
        run: python scripts/agent_supervisor.py
      - name: Render
        run: |
          python scripts/render.py --repo "${{ inputs.repo }}" --issue "${{ inputs.issue }}" \
            --relevance outputs/relevance.json \
            --issue-title "${{ steps.snap.outputs.title }}" \
            --snapshot "${{ steps.snap.outputs.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --status "$(python -c 'import json;print(json.load(open("outputs/result.json")).get("status","failed"))' 2>/dev/null || echo failed)" \
            --reason "$(python -c 'import json;print(json.load(open("outputs/result.json")).get("reason",""))' 2>/dev/null || echo '')"
      - name: App token (issues:write)
        id: app_rw
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          client-id: ${{ vars.LILY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LILY_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Write back
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          COMMENT_ID: ""
          GH_RW_TOKEN: ${{ steps.app_rw.outputs.token }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          SNAPSHOT_HASH: ${{ steps.snap.outputs.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL_KEY_MISTRAL: ${{ secrets.MODEL_KEY_MISTRAL }}
          SELF_TOKEN: ${{ github.token }}
          B_REPO: ${{ github.repository }}
        run: python scripts/write_back.py
