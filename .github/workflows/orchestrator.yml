name: orchestrator

on:
  workflow_dispatch:
    inputs:
      repo:
        description: issue 所在仓库（owner/name，config/repos.json 的键）
        required: true
        type: string
      issue:
        description: issue 编号
        required: true
        type: string
      comment_id:
        description: 触发评论 id（issue_comment 事件）
        required: false
        type: string
      event:
        description: 事件类型：issues 或 issue_comment
        required: true
        type: string
      dry_run:
        description: 为 true 时只跑 gate/analysis、不发评论
        required: false
        default: "false"
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: lily-${{ inputs.repo }}-${{ inputs.issue }}
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
    outputs:
      decision: ${{ steps.gate.outputs.decision }}
      comment_id: ${{ steps.gate.outputs.comment_id }}
      snapshot_hash: ${{ steps.gate.outputs.snapshot_hash }}
      code_repo: ${{ steps.gate.outputs.code_repo }}
      code_ref: ${{ steps.gate.outputs.code_ref }}
      code_refs: ${{ steps.gate.outputs.code_refs }}
      cache_prefix: ${{ steps.gate.outputs.cache_prefix }}
      issue_title: ${{ steps.gate.outputs.issue_title }}
      target_owner: ${{ steps.target.outputs.owner }}
      target_repo: ${{ steps.target.outputs.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Parse target repo
        id: target
        env:
          TARGET_REPO: ${{ inputs.repo }}
        run: |
          owner="${TARGET_REPO%%/*}"
          name="${TARGET_REPO#*/}"
          echo "owner=$owner" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      # TODO：正式启用前把第三方 action pin 到完整 commit SHA。
      - name: App token (read)
        id: app_ro
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          client-id: ${{ vars.LILY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LILY_APP_PRIVATE_KEY }}
          permission-issues: read
          permission-contents: read
      - name: App token (issues:write)
        id: app_rw
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ steps.target.outputs.owner }}
          repositories: ${{ steps.target.outputs.name }}
          client-id: ${{ vars.LILY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LILY_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Gate
        id: gate
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          COMMENT_ID: ${{ inputs.comment_id }}
          EVENT: ${{ inputs.event }}
          GH_RO_TOKEN: ${{ steps.app_ro.outputs.token }}
          GH_RW_TOKEN: ${{ steps.app_rw.outputs.token }}
          SELF_TOKEN: ${{ github.token }}
          B_REPO: ${{ github.repository }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          DRY_RUN: ${{ inputs.dry_run }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/gate.py
      - name: Upload gate inputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ github.run_id }}
          path: inputs/
          if-no-files-found: ignore
          retention-days: 30

  analysis:
    needs: gate
    if: needs.gate.outputs.decision == 'proceed'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    permissions:
      contents: read
    # 阶段一：Required reviewers = owner；阶段二移除审批或整行。
    environment: llm
    steps:
      - uses: actions/checkout@v4
      - name: Download gate inputs
        uses: actions/download-artifact@v4
        with:
          name: gate-${{ github.run_id }}
          path: inputs
      - name: App token (read, step scoped)
        id: app_ro
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ needs.gate.outputs.target_owner }}
          repositories: ${{ needs.gate.outputs.target_repo }}
          client-id: ${{ vars.LILY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LILY_APP_PRIVATE_KEY }}
          permission-issues: read
          permission-contents: read
      - name: Restore GT6 mirror
        uses: actions/cache/restore@v4
        with:
          path: .cache/gt6.git
          key: ${{ needs.gate.outputs.cache_prefix }}-${{ github.run_id }}
          restore-keys: ${{ needs.gate.outputs.cache_prefix }}-
      - name: Sync mirror and create worktrees
        env:
          CODE_REPO: ${{ needs.gate.outputs.code_repo }}
          CODE_REFS: ${{ needs.gate.outputs.code_refs }}
        run: |
          set -euo pipefail
          mkdir -p .cache
          if [ -d .cache/gt6.git ]; then
            git -C .cache/gt6.git remote set-url origin "https://github.com/$CODE_REPO.git"
            git -C .cache/gt6.git fetch --prune --tags
            rm -rf .cache/gt6.git/code
            git -C .cache/gt6.git worktree prune
          else
            git clone --mirror "https://github.com/$CODE_REPO.git" .cache/gt6.git
          fi
          worktree_root="$PWD/code"
          mkdir -p "$worktree_root"
          primary=""
          for ref in $CODE_REFS; do
            slug=$(printf '%s' "$ref" | tr '/ ' '__')
            git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" "$ref" || \
              git -C .cache/gt6.git worktree add -f "$worktree_root/$slug" master
            if [ -z "$primary" ]; then primary="$slug"; fi
          done
          ln -sfn "$primary" code/current
      - name: Save GT6 mirror
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: .cache/gt6.git
          key: ${{ needs.gate.outputs.cache_prefix }}-${{ github.run_id }}
      - name: Install Codex CLI (pin before production)
        run: npm install -g @openai/codex@0.166.0
      - name: Prefetch attachments
        run: python scripts/prefetch.py
      - name: Run Codex under supervisor
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          GH_RO_TOKEN: ${{ steps.app_ro.outputs.token }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          MODEL_KEY_MISTRAL: ${{ secrets.MODEL_KEY_MISTRAL }}
        run: python scripts/agent_supervisor.py
      - name: Upload analysis outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: analysis-${{ github.run_id }}
          path: outputs/
          if-no-files-found: ignore
          retention-days: 30

  write-back:
    needs: [gate, analysis]
    if: always() && needs.gate.outputs.decision == 'proceed' && inputs.dry_run != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v4
      - name: Download analysis outputs
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: analysis-${{ github.run_id }}
          path: outputs
      - name: App token (issues:write, step scoped)
        id: app_rw
        uses: actions/create-github-app-token@v3
        with:
          owner: ${{ needs.gate.outputs.target_owner }}
          repositories: ${{ needs.gate.outputs.target_repo }}
          client-id: ${{ vars.LILY_APP_CLIENT_ID }}
          private-key: ${{ secrets.LILY_APP_PRIVATE_KEY }}
          permission-issues: write
      - name: Render
        continue-on-error: true
        run: |
          python scripts/render.py \
            --repo "${{ inputs.repo }}" \
            --issue "${{ inputs.issue }}" \
            --issue-title "${{ needs.gate.outputs.issue_title }}" \
            --snapshot "${{ needs.gate.outputs.snapshot_hash }}" \
            --relevance outputs/relevance.json \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --status "$(python -c 'import json;print(json.load(open("outputs/result.json")).get("status","failed"))' 2>/dev/null || echo failed)" \
            --reason "$(python -c 'import json;print(json.load(open("outputs/result.json")).get("reason",""))' 2>/dev/null || echo '')"
      - name: Write back
        env:
          REPO: ${{ inputs.repo }}
          ISSUE: ${{ inputs.issue }}
          COMMENT_ID: ${{ needs.gate.outputs.comment_id }}
          GH_RW_TOKEN: ${{ steps.app_rw.outputs.token }}
          GH_RO_TOKEN: ${{ steps.app_rw.outputs.token }}
          BOT_ENABLED: ${{ vars.BOT_ENABLED }}
          SNAPSHOT_HASH: ${{ needs.gate.outputs.snapshot_hash }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MODEL_KEY_MISTRAL: ${{ secrets.MODEL_KEY_MISTRAL }}
          SELF_TOKEN: ${{ github.token }}
          B_REPO: ${{ github.repository }}
        run: python scripts/write_back.py
