# Tinyproxy：容器出网的唯一出口。
#
# 只监听 8888，按 `egress-allowlist-docker.txt` 做域名白名单；
# 容器以非 root 运行，pid 与日志都写到可写位置（/tmp 由 compose 的 tmpfs 提供）。

Port 8888
Listen 0.0.0.0
Timeout 600
MaxClients 50

PidFile "/tmp/tinyproxy.pid"
# 不写 /dev/stdout：tinyproxy 会在启动时 stat 日志文件，管道/符号链接会被判定为
# "changed before it could be opened" 而放弃日志。写到 tmpfs，运维用 exec 查看。
LogFile "/tmp/tinyproxy.log"
LogLevel Connect

# 只接受 Docker 私有网段与容器自身的健康检查，避免代理被同宿主上的其他容器滥用。
Allow 127.0.0.1
Allow 10.0.0.0/8
Allow 172.16.0.0/12
Allow 192.168.0.0/16

# 只允许 HTTP/HTTPS，且仅限标准端口。
ConnectPort 443
ConnectPort 80

# 默认拒绝：未命中白名单的域名一律 403。
FilterDefaultDeny Yes
# 1.11 起旧选项 FilterExtended 已废弃，改为显式指定正则类型。
FilterType ere
FilterCaseSensitive No
FilterURLs Off
Filter "/etc/tinyproxy/filter"

DisableViaHeader Yes
